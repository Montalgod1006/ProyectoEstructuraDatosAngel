<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF4FF"/>
      <stop offset="100%" stop-color="#D8ECFF"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EE08C"/>
      <stop offset="100%" stop-color="#3FC96B"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FB8FF"/>
      <stop offset="100%" stop-color="#3D8BFF"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C29CFF"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2B3A55" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- fondo redondeado tipo "app icon" -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- linea base -->
  <line x1="96" y1="392" x2="416" y2="392" stroke="#B9CEE8" stroke-width="6" stroke-linecap="round"/>

  <!-- destellos de diversion -->
  <g fill="#FFC845">
    <path d="M120 118 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
  </g>
  <circle cx="392" cy="140" r="7" fill="#3D8BFF" opacity="0.8"/>
  <circle cx="410" cy="170" r="4" fill="#3FC96B" opacity="0.8"/>

  <!-- flecha de intercambio (swap) entre barra 2 y 3 -->
  <g stroke="#7A8CA8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M186 250 Q216 220 246 250"/>
    <path d="M186 268 Q216 298 246 268"/>
  </g>
  <path d="M180 250 l10 -13 6 13 z" fill="#7A8CA8"/>
  <path d="M252 268 l-10 13 -6 -13 z" fill="#7A8CA8"/>

  <!-- barras ascendentes -->
  <g filter="url(#soft)">
    <rect x="96"  y="332" width="52" height="60"  rx="16" fill="url(#bar1)"/>
    <rect x="164" y="292" width="52" height="100" rx="16" fill="url(#bar2)"/>
    <rect x="232" y="242" width="52" height="150" rx="16" fill="url(#bar3)"/>
    <rect x="300" y="182" width="52" height="210" rx="16" fill="url(#bar4)"/>
    <rect x="368" y="122" width="52" height="270" rx="16" fill="url(#bar5)"/>
  </g>

  <!-- carita amigable en la barra mas alta -->
  <g>
    <circle cx="382" cy="150" r="9" fill="#2B2B3A"/>
    <circle cx="406" cy="150" r="9" fill="#2B2B3A"/>
    <circle cx="385" cy="147" r="3" fill="#FFFFFF"/>
    <circle cx="409" cy="147" r="3" fill="#FFFFFF"/>
    <path d="M378 172 Q394 188 410 172" stroke="#2B2B3A" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- cachetes -->
  <circle cx="372" cy="164" r="7" fill="#FF8FA3" opacity="0.55"/>
  <circle cx="416" cy="164" r="7" fill="#FF8FA3" opacity="0.55"/>
</svg>
